name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: targetgum
          POSTGRES_PASSWORD: targetgum
          POSTGRES_DB: targetgum_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://targetgum:targetgum@localhost:5432/targetgum_test
      # prisma/schema.prisma requires directUrl (used by migrate); same DB in CI.
      DIRECT_URL: postgresql://targetgum:targetgum@localhost:5432/targetgum_test
      # BullMQ queue tests (weekly intelligence) run against the redis service.
      REDIS_URL: redis://localhost:6379
      # Test-only value; the cron route tests authenticate with it.
      CRON_SECRET: ci-test-cron-secret
      AUTH_SECRET: ci-test-secret
      INTEGRATION_ENCRYPTION_KEY: ci-test-encryption-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Security tests
        run: npm run test:security

      - name: Build
        run: npm run build
